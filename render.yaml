services:
  # ─── React Frontend Static Site ──────────────────────────────────────────────
  - type: web
    name: schemesecure-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: schemesecure-backend
          property: host

  # ─── Python FastAPI Backend Service ──────────────────────────────────────────
  - type: web
    name: schemesecure-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://schemesecure-ai.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: government_scheme_leakage
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "SchemeSecure AI — AI Government Scheme Fraud Detection & Verification System"

