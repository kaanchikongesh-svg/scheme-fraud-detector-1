services:
  # ─── Python FastAPI Backend Service ──────────────────────────────────────────
  - type: web
    name: govkavach-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://govkavach-ai.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: government_scheme_leakage
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "GovKavach AI — Scheme Leakage Detector"
