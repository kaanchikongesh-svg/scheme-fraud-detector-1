<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — SchemeSecure AI Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; padding:24px 16px;">

  <div style="max-width:480px; width:100%;">
    <!-- Brand Header -->
    <div style="text-align:center; margin-bottom:28px;">
      <a href="index.html" class="brand-logo" style="justify-content:center; font-size:1.6rem; margin-bottom:8px;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #3b82f6;">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <span>SchemeSecure<span style="color:#60a5fa;">AI</span></span>
      </a>
      <p style="color:var(--text-secondary); font-size:0.9rem;">AI Government Scheme Fraud Detection & Verification System</p>
    </div>

    <!-- Auth Card -->
    <div class="card" style="padding:32px;">
      <!-- Tab Switcher -->
      <div style="display:flex; border-bottom:1px solid var(--border-color); margin-bottom:24px;">
        <button id="tab-login" onclick="switchAuthTab('login')" class="btn" style="flex:1; border-radius:0; border-bottom:2px solid var(--accent-primary); background:transparent; color:#fff; padding:10px;">
          Sign In
        </button>
        <button id="tab-register" onclick="switchAuthTab('register')" class="btn" style="flex:1; border-radius:0; border-bottom:2px solid transparent; background:transparent; color:var(--text-muted); padding:10px;">
          Register Citizen
        </button>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Official Email or Registered ID</label>
          <input id="login-email" type="email" class="form-input no-icon" required placeholder="admin@gov.in" value="admin@gov.in">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input id="login-password" type="password" class="form-input no-icon" required placeholder="••••••••" value="admin123">
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:8px;">
          Authenticate & Enter
        </button>
      </form>

      <!-- Register Form -->
      <form id="register-form" onsubmit="handleRegisterSubmit(event)" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input id="reg-name" type="text" class="form-input no-icon" required placeholder="Ramesh Kumar">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input id="reg-email" type="email" class="form-input no-icon" required placeholder="user@gmail.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input id="reg-password" type="password" class="form-input no-icon" required placeholder="••••••••">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm Password</label>
          <input id="reg-confirm" type="password" class="form-input no-icon" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-emerald btn-full btn-lg" style="margin-top:8px;">
          Create Citizen Account
        </button>
      </form>

      <!-- Quick Demo Access Section -->
      <div style="margin-top:28px; padding-top:20px; border-top:1px solid var(--border-color);">
        <div style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); text-align:center; margin-bottom:12px;">
          ⚡ 1-Click Demo Login
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <button onclick="quickFillAndLogin('admin@gov.in', 'admin123')" class="btn btn-sm btn-outline" style="font-size:0.75rem; text-align:left;">
            🛡️ Admin<br><span style="color:var(--text-muted); font-size:0.7rem;">admin@gov.in</span>
          </button>
          <button onclick="quickFillAndLogin('do.rao@gov.in', 'officer123')" class="btn btn-sm btn-outline" style="font-size:0.75rem; text-align:left;">
            🏢 District Officer<br><span style="color:var(--text-muted); font-size:0.7rem;">do.rao@gov.in</span>
          </button>
          <button onclick="quickFillAndLogin('vo.k@gov.in', 'officer123')" class="btn btn-sm btn-outline" style="font-size:0.75rem; text-align:left;">
            🔍 Verifying Officer<br><span style="color:var(--text-muted); font-size:0.7rem;">vo.k@gov.in</span>
          </button>
          <button onclick="quickFillAndLogin('citizen@gmail.com', 'citizen123')" class="btn btn-sm btn-outline" style="font-size:0.75rem; text-align:left;">
            👤 Citizen User<br><span style="color:var(--text-muted); font-size:0.7rem;">citizen@gmail.com</span>
          </button>
        </div>
      </div>

    </div>

    <div style="text-align:center; margin-top:20px;">
      <a href="index.html" style="font-size:0.85rem; color:var(--text-muted);">← Return to Public Homepage</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function switchAuthTab(tab) {
      const loginForm = document.getElementById("login-form");
      const regForm = document.getElementById("register-form");
      const tabLogin = document.getElementById("tab-login");
      const tabReg = document.getElementById("tab-register");

      if (tab === 'login') {
        loginForm.style.display = 'block';
        regForm.style.display = 'none';
        tabLogin.style.borderBottomColor = 'var(--accent-primary)';
        tabLogin.style.color = '#fff';
        tabReg.style.borderBottomColor = 'transparent';
        tabReg.style.color = 'var(--text-muted)';
      } else {
        loginForm.style.display = 'none';
        regForm.style.display = 'block';
        tabReg.style.borderBottomColor = 'var(--accent-emerald)';
        tabReg.style.color = '#fff';
        tabLogin.style.borderBottomColor = 'transparent';
        tabLogin.style.color = 'var(--text-muted)';
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      const res = await Auth.login(email, password);
      if (res.success) {
        setTimeout(() => { window.location.href = "dashboard.html"; }, 500);
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById("reg-name").value;
      const email = document.getElementById("reg-email").value;
      const password = document.getElementById("reg-password").value;
      const confirm_password = document.getElementById("reg-confirm").value;

      if (password !== confirm_password) {
        showToast("Passwords do not match", "error");
        return;
      }

      const res = await Auth.register({
        name, email, password, confirm_password, district_id: 1
      });
      if (res.success) {
        setTimeout(() => { window.location.href = "dashboard.html"; }, 500);
      }
    }

    async function quickFillAndLogin(email, password) {
      document.getElementById("login-email").value = email;
      document.getElementById("login-password").value = password;
      const res = await Auth.login(email, password);
      if (res.success) {
        setTimeout(() => { window.location.href = "dashboard.html"; }, 400);
      }
    }
  </script>
</body>
</html>
