<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="50%" stopColor="#1D4ED8" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Silhouette -->
  <path d="M32 4L10 13V28C10 44 19.5 56 32 60C44.5 56 54 44 54 28V13L32 4Z" 
        fill="url(#shieldGrad)" stroke="url(#glowGrad)" stroke-width="2.5" />

  <!-- Inner Cyber Grid Accent -->
  <path d="M32 10L16 17V27C16 39.5 23 48.5 32 52C41 48.5 48 39.5 48 27V17L32 10Z" 
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Central Government Ashoka / AI Core Motif -->
  <circle cx="32" cy="27" r="7" fill="none" stroke="#60A5FA" stroke-width="2" />
  <circle cx="32" cy="27" r="2.5" fill="#10B981" />
  
  <!-- Radiating Integrity Nodes -->
  <path d="M32 14V20M32 34V40M19 27H25M39 27H45" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="32" cy="14" r="1.5" fill="#60A5FA" />
  <circle cx="32" cy="40" r="1.5" fill="#60A5FA" />
  <circle cx="19" cy="27" r="1.5" fill="#60A5FA" />
  <circle cx="45" cy="27" r="1.5" fill="#60A5FA" />

  <!-- Verification Check Mark Overlay -->
  <path d="M26 43L30 47L38 39" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>